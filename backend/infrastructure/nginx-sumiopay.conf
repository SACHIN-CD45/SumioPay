# ==============================================================================
# SumioPay Enterprise Production Nginx Configuration
# Domains:
#   - Frontend: sumiopay.sumiotech.in, www.sumiopay.sumiotech.in
#   - Backend API: apipay.sumiotech.in
# ==============================================================================

# Rate Limiting Zones (Anti-DDoS & Anti-Scraping)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# ------------------------------------------------------------------------------
# 1. FRONTEND: sumiopay.sumiotech.in & www.sumiopay.sumiotech.in
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name sumiopay.sumiotech.in www.sumiopay.sumiotech.in;

    # Root directory pointing to built React Vite frontend
    root /var/www/sumiopay/frontend/dist;
    index index.html;

    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Enterprise Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Direct APK & Plugin File Downloads (never stale-cache APK updates)
    location /downloads/ {
        alias /var/www/sumiopay/frontend/dist/downloads/;
        add_header Content-Disposition 'attachment';
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Proxy /api to backend API so both hostnames resolve cleanly
    location /api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host apipay.sumiotech.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Crawler, GSC verification, and LLM discovery files (exact file or 404, never SPA rewrite)
    location = /google0cf25f56b37cce89.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt)$ {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # Strictly block SuperAdmin, merchant workspace, checkout sessions & login from search indexing
    location ~ ^/(superadmin|pay|login|dashboard|orders|devices|connect|reconciliation|projects|team|billing|profile|refunds|reports|webhooks|simulator|docs|disclaimer)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html =404;
    }

    # Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Asset Caching (Vite hashed bundles)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Redirect error pages to index
    error_page 404 /index.html;
}

# ------------------------------------------------------------------------------
# 2. BACKEND API: apipay.sumiotech.in
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name apipay.sumiotech.in;

    client_max_body_size 25M;

    # Enterprise Security Headers
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Real-Time WebSockets (Socket.IO for Instant Green Payment Confirmation)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Public Drop-in Checkout JS SDK
    location = /checkout.js {
        proxy_pass http://127.0.0.1:8090/checkout.js;
        proxy_set_header Host $host;
        expires 1d;
    }

    # Stricter Rate Limiting for Login & Auth
    location ~ ^/api/(superadmin|merchant)/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main REST API Reverse Proxy
    location / {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # SRE Health Probes
    location /health {
        proxy_pass http://127.0.0.1:8090/health;
        proxy_http_version 1.1;
    }
}
