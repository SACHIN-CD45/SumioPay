version: '3.8'

services:
  mongodb:
    image: mongo:6-jammy
    container_name: sumiopay-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: sumiopay
    networks:
      - sumiopay-network

  redis:
    image: redis:7-alpine
    container_name: sumiopay-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sumiopay-network

  backend:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: sumiopay-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/sumiopay
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-sumiopay_prod_jwt_super_secret_key_98124}
      CENTRAL_BACKEND_URL: http://backend:5000
      BASE_URL: ${BASE_URL:-https://pay.sumiotech.com}
    depends_on:
      - mongodb
      - redis
    networks:
      - sumiopay-network

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: sumiopay-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sumiopay-network

networks:
  sumiopay-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
